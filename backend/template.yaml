            Method: get
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /profile
            Method: put

  # AppSync GraphQL Resources
  EduFlowGraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: EduFlowGraphQL
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: us-east-1_hhb2NN8Nw
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW

  EduFlowGraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt EduFlowGraphQLApi.ApiId
      DefinitionS3Location: schema.graphql

  AppSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GetCoursesFunction.Arn

  CoursesDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt EduFlowGraphQLApi.ApiId
      Name: CoursesDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetCoursesFunction.Arn

  GetCoursesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt EduFlowGraphQLApi.ApiId
      TypeName: Query
      FieldName: getCourses
      DataSourceName: !GetAtt CoursesDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Invoke",
          "payload": $util.toJson($context)
        }
      ResponseMappingTemplate: |
        #if($context.error)
          $util.error($context.error.message, $context.error.type)
        #end
        $util.toJson($context.result)

  CreateCourseResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt EduFlowGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createCourse
      DataSourceName: !GetAtt CoursesDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
