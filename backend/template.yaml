      Name: StudentsDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetStudentsFunction.Arn

  EnrollmentsDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt EduFlowGraphQLApi.ApiId
