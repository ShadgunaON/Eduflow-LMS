AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EduFlow LMS Backend
  AWS SAM Template for Decoupled Serverless Backend

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref TableName

Parameters:
  TableName:
    Type: String
    Default: EduflowLMS
    Description: Name of the existing DynamoDB table

Resources:
  # API Gateway
  EduFlowApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_hhb2NN8Nw" # Hardcoded based on env file, can be parameterized

  # Lambda Functions
  GetCoursesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/courses.js
    Properties:
      CodeUri: .
      Handler: src/handlers/courses.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetCourses:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /courses
            Method: get
        CreateCourse:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /courses
            Method: post

  GetStudentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/students.js
    Properties:
      CodeUri: .
      Handler: src/handlers/students.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetStudents:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /students
            Method: get
        CreateStudent:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /students
            Method: post
        UpdateStudent:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /students/{id}
            Method: put
        DeleteStudent:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /students/{id}
            Method: delete

  GetEnrollmentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/enrollments.js
    Properties:
      CodeUri: .
      Handler: src/handlers/enrollments.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetEnrollments:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /enrollments
            Method: get
        CreateEnrollment:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /enrollments
            Method: post

  GetActivitiesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/activities.js
    Properties:
      CodeUri: .
      Handler: src/handlers/activities.handler
      Policies:
        - DynamoDBCrudPolicy:
