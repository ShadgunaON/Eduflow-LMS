      Events:
        GetActivities:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /activities
            Method: get
        CreateActivity:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /activities
            Method: post

  AssignmentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/assignments.js
    Properties:
      CodeUri: .
      Handler: src/handlers/assignments.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetAssignments:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /assignments
            Method: get
        CreateAssignment:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /assignments
            Method: post
        SubmitAssignment:
          Type: Api
          Properties:
            RestApiId: !Ref EduFlowApi
            Path: /assignments/submit
            Method: post

  QuizzesFunction:
    Type: AWS::Serverless::Function
    Metadata:
