version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -e AUTH_SECRET -e AUTH_URL -e AUTH_TRUST_HOST -e COGNITO_ -e DYNAMODB_ -e S3_ -e NEXT_PUBLIC_APP_URL -e AWS_REGION >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
